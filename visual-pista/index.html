<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LED Pista · CLUBE</title>
<style>
  @font-face { font-family: "Archivo"; src: url("assets/Archivo-Regular.ttf"); }
  html, body { margin: 0; height: 100%; background: #0b0b0b; overflow: hidden; color: #e3e4e5; font: 12px/1.5 "Archivo", system-ui, sans-serif; }
  canvas { display: block; }
  body.saida { background: #000; cursor: none; }
  body.saida #hud, body.saida #rotulos { display: none; }
  #hud { position: fixed; right: 16px; top: 16px; width: 300px; background: rgba(8, 8, 8, .84); border: 1px solid #2b2b2b; border-radius: 10px; padding: 14px 16px; }
  #hud h1 { margin: 0 0 8px; font-size: 11px; font-weight: 400; letter-spacing: .14em; text-transform: uppercase; color: #9d9d9e; }
  #info div { display: flex; flex-direction: column; margin-bottom: 6px; }
  #info span { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: #6f6f6f; }
  .botoes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; }
  .botoes button { font: inherit; color: #e3e4e5; background: #1a1a1a; border: 1px solid #333; border-radius: 6px; padding: 7px 8px; cursor: pointer; text-align: left; }
  .botoes button:hover { background: #262626; }
  .botoes kbd { float: right; color: #6f6f6f; font: inherit; }
  #rotulos div { position: fixed; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: #6f6f6f; white-space: nowrap; pointer-events: none; }
  #r-dobra { color: #9d9d9e !important; }
</style>
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="hud">
  <h1>LED Pista · CLUBE</h1>
  <div id="info">carregando…</div>
  <div class="botoes">
    <button data-a="mic">Entrada de áudio <kbd>A</kbd></button>
    <button data-a="teste">Som de teste <kbd>T</kbd></button>
    <button data-a="virar">Virar agora <kbd>espaço</kbd></button>
    <button data-a="cena">Trocar cena <kbd>C</kbd></button>
    <button data-a="paleta">Trocar paleta <kbd>P</kbd></button>
  </div>
</div>
<div id="rotulos">
  <div id="r-entrada">▲ ponta da entrada</div>
  <div id="r-teto">teto · 9,28 m</div>
  <div id="r-dobra">— dobra —</div>
  <div id="r-dj">fundo do DJ · 1,28 m</div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
