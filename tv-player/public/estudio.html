<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0c0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Estúdio de luz</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg:#0b0c0e; --s1:#15171b; --s2:#1d2025; --s3:#262a31; --line:rgba(255,255,255,.08);
    --ink:#f3f4f6; --muted:#979da6; --dim:#5d636c; --ok:#34d17a; --warn:#ffc465; --danger:#ff5a3c;
    --luz:#ffffff; --ease:cubic-bezier(.2,.8,.2,1);
    --bumbo:#ff4a1f; --grave:#ff8a2e; --medio:#1fd061; --agudo:#27b0ee;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; margin:0; background:var(--bg); color:var(--ink); overflow:hidden; overscroll-behavior:none;
    font-family:-apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased; touch-action:manipulation; }
  button,a { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; text-decoration:none; }
  button:disabled { opacity:.3; cursor:default; }
  :focus-visible { outline:2px solid #fff; outline-offset:2px; }
  .i { width:22px; height:22px; display:block; flex:none; }
  [hidden] { display:none !important; }

  .app { position:relative; height:100%; height:100dvh; display:flex; flex-direction:column; padding-top:env(safe-area-inset-top); }

  /* topo */
  .topo { display:flex; align-items:center; gap:2px; padding:6px 8px; flex:none; }
  .ico { width:44px; height:44px; flex:none; display:grid; place-items:center; border-radius:50%; color:var(--ink); transition:background .15s, transform .15s var(--ease); }
  .ico:active { background:var(--s3); transform:scale(.92); }
  .zonas { flex:1; min-width:0; display:flex; justify-content:center; gap:4px; }
  .zona { display:flex; align-items:center; gap:5px; height:38px; padding:0 10px; border-radius:19px; color:var(--muted); font-size:13px; font-weight:650; white-space:nowrap; }
  .zona .i { width:18px; height:18px; }
  .zona[aria-pressed="true"] { background:var(--s3); color:var(--ink); }
  
  /* palco */
  .palco { position:relative; flex:none; height:clamp(156px,27dvh,290px); margin:0 12px; border-radius:22px; overflow:hidden; background:#040405; box-shadow:inset 0 0 0 1px var(--line); isolation:isolate; }
  #luz { position:absolute; inset:-10%; width:120%; height:120%; filter:blur(34px) saturate(1.5); opacity:.34; z-index:-1; }
  #tela { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .palco-cima, .palco-baixo { position:absolute; left:8px; right:8px; display:flex; align-items:center; gap:6px; }
  .palco-cima { top:8px; } .palco-baixo { bottom:8px; }
  .vidro { background:rgba(10,11,13,.58); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); box-shadow:inset 0 0 0 1px rgba(255,255,255,.1); }
  .modo { display:flex; align-items:center; gap:6px; height:36px; padding:0 13px 0 9px; border-radius:18px; font-size:12px; font-weight:750; letter-spacing:.02em; }
  .modo .i { width:18px; height:18px; }
  .modo.vivo { background:var(--danger); color:#fff; box-shadow:0 0 18px rgba(255,90,60,.55); }
  .bola { width:40px; height:40px; border-radius:50%; display:grid; place-items:center; transition:transform .12s var(--ease), background .15s; touch-action:none; }
  .bola:active { transform:scale(.9); }
  .bola .i { width:20px; height:20px; }
  .bola.on { background:rgba(10,11,13,.58); color:var(--ok); }
  #flash.on { background:#fff; color:#111; box-shadow:0 0 22px #fff; }
  .bola.apagada { color:var(--danger); }
  .bola.confirmar { background:var(--warn); color:#111; }
  .esp { flex:1; min-width:0; }
  .nome-ar { min-width:0; max-width:60%; height:30px; display:flex; align-items:center; padding:0 11px; border-radius:15px; font-size:12px; font-weight:600; color:#e5e6e9; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .mini { display:flex; gap:3px; align-items:flex-end; height:30px; padding:6px 9px; border-radius:15px; }
  .mini i { width:5px; height:100%; border-radius:3px; background:currentColor; transform-origin:bottom; transform:scaleY(.08); will-change:transform; }
  .mini i:nth-child(1){color:var(--bumbo)} .mini i:nth-child(2){color:var(--grave)} .mini i:nth-child(3){color:var(--medio)} .mini i:nth-child(4){color:var(--agudo)}
  .envia { display:flex; align-items:center; gap:7px; height:36px; padding:0 14px 0 11px; border-radius:18px; background:var(--ink); color:#111; font-size:13px; font-weight:750; }
  .envia .i { width:18px; height:18px; }

  /* régua */
  .regua { position:relative; display:flex; align-items:center; gap:10px; height:48px; padding:0 14px; border-radius:15px; background:var(--s2); overflow:hidden; touch-action:pan-y; user-select:none; -webkit-user-select:none; cursor:ew-resize; }
  .regua .cheio { position:absolute; inset:0 auto 0 0; width:0; background:var(--tom,#c6c9cf); border-radius:0; pointer-events:none; }
  .regua .i, .regua .val, .regua .nom { position:relative; mix-blend-mode:difference; color:#fff; }
  .regua .i { width:20px; height:20px; }
  .regua .nom { font-size:12px; font-weight:650; flex:1; min-width:0; white-space:nowrap; }
  .regua .val { font-size:13px; font-weight:700; font-variant-numeric:tabular-nums; }
  .regua.compacta { height:40px; border-radius:12px; }
  .regua.com-tom .i, .regua.com-tom .val, .regua.com-tom .nom { mix-blend-mode:normal; text-shadow:0 1px 3px rgba(0,0,0,.65); }
  .geral { flex:none; padding:8px 12px 0; }

  /* painéis */
  main { flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:10px 12px 18px; overscroll-behavior:contain; -webkit-mask-image:linear-gradient(transparent,#000 10px); mask-image:linear-gradient(transparent,#000 10px); }
  .sec { margin-bottom:18px; }
  .tit { display:flex; align-items:center; gap:7px; margin:2px 2px 9px; color:var(--muted); font-size:12px; font-weight:650; }
  .tit .i { width:16px; height:16px; }
  .tit .fim { margin-left:auto; }
  .chips { display:flex; gap:6px; overflow-x:auto; margin:0 -12px 10px; padding:2px 12px; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { flex:none; width:60px; padding:8px 2px 6px; display:grid; justify-items:center; gap:4px; border-radius:15px; background:var(--s1); color:var(--muted); font-size:10.5px; font-weight:650; }
  .chip[aria-pressed="true"] { background:var(--ink); color:#101114; }
  .chip .i { width:20px; height:20px; }

  .grade { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
  @media (min-width:560px) { .grade { grid-template-columns:repeat(4,minmax(0,1fr)); } }
  .cena { position:relative; display:block; text-align:left; border-radius:14px; overflow:hidden; background:#050506 center/cover no-repeat; aspect-ratio:4/5; box-shadow:inset 0 0 0 1px var(--line); transition:transform .15s var(--ease); }
  .cena.deitada { aspect-ratio:8/5; background-size:100% 100%; }
  .cena.deitada video { object-fit:fill; }
  .sentidos { margin-bottom:10px; }
  .cena:active { transform:scale(.96); }
  .cena video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .cena span { position:absolute; left:0; right:0; bottom:0; padding:16px 7px 6px; font-size:11px; font-weight:650; line-height:1.15; background:linear-gradient(transparent,rgba(0,0,0,.82)); }
  .cena.on { box-shadow:inset 0 0 0 2px #fff, 0 0 16px var(--luz); }
  .cena.on::after { content:""; position:absolute; top:7px; right:7px; width:9px; height:9px; border-radius:50%; background:#fff; box-shadow:0 0 8px #fff; }
  .cena .nada { position:absolute; inset:0; display:grid; place-items:center; color:var(--dim); }
  .faixa-aviso { display:flex; align-items:center; gap:9px; padding:10px 12px; margin-bottom:10px; border-radius:13px; background:var(--s2); font-size:13px; font-weight:600; }
  .faixa-aviso .i { width:18px; height:18px; }
  .faixa-aviso button { margin-left:auto; }
  .vazio { display:grid; justify-items:center; gap:8px; padding:26px 12px; color:var(--dim); text-align:center; font-size:13px; }
  .vazio .i { width:30px; height:30px; }

  .ladrilhos { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; }
  @media (min-width:430px) { .ladrilhos.cinco { grid-template-columns:repeat(5,minmax(0,1fr)); } }
  .lad { position:relative; display:grid; justify-items:center; align-content:center; gap:5px; min-height:68px; padding:9px 2px 7px; border-radius:15px; background:var(--s1); color:#c8ccd2; font-size:10.5px; font-weight:650; line-height:1.1; text-align:center; transition:background .15s, transform .12s var(--ease), box-shadow .15s; }
  .lad:active { transform:scale(.94); }
  .lad .i { width:24px; height:24px; }
  .lad.on { background:var(--s3); color:#fff; box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.55); }
  .lad.ativo { box-shadow:inset 0 0 0 2px #fff; }
  .lad.ligado::after { content:""; position:absolute; top:7px; right:7px; width:7px; height:7px; border-radius:50%; background:var(--cor-brilho,#fff); box-shadow:0 0 7px var(--cor-brilho,#fff); }
  .lad.dispara { background:#fff; color:#111; box-shadow:0 0 22px rgba(255,255,255,.75); transition:none; }

  .pals { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
  .pal { display:grid; gap:5px; text-align:left; font-size:11px; font-weight:650; color:#c8ccd2; }
  .pal i { display:grid; place-items:center; height:38px; border-radius:11px; box-shadow:inset 0 0 0 1px var(--line); transition:box-shadow .15s; }
  .pal[aria-pressed="true"] { color:#fff; }
  .pal[aria-pressed="true"] i { box-shadow:inset 0 0 0 2px #fff, 0 0 12px var(--luz); }

  .cores { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .cor { width:36px; height:36px; border-radius:50%; box-shadow:inset 0 0 0 1px rgba(255,255,255,.18); transition:transform .12s var(--ease); }
  .cor:active { transform:scale(.88); }
  .cor[aria-pressed="true"] { box-shadow:0 0 0 2px var(--bg), 0 0 0 4px #fff; }
  .roda-caixa { display:flex; justify-content:center; padding:12px 0 2px; }
  .roda { position:relative; width:176px; height:176px; border-radius:50%; touch-action:none; cursor:crosshair; }
  .roda canvas { width:100%; height:100%; border-radius:50%; display:block; }
  .roda b { position:absolute; width:22px; height:22px; margin:-11px; border-radius:50%; border:3px solid #fff; box-shadow:0 0 0 1px rgba(0,0,0,.6), 0 1px 6px rgba(0,0,0,.6); pointer-events:none; }
  .espacos { display:flex; gap:8px; margin-bottom:10px; }
  .espaco { flex:1; height:40px; border-radius:11px; box-shadow:inset 0 0 0 1px var(--line); }
  .espaco[aria-pressed="true"] { box-shadow:0 0 0 2px var(--bg), 0 0 0 4px #fff; }
  .pilha { display:grid; gap:8px; margin-top:10px; }
  .botoes { display:flex; gap:6px; flex-wrap:wrap; }
  .peq { width:44px; height:44px; display:grid; place-items:center; border-radius:12px; background:var(--s2); color:#d3d6db; transition:background .15s; }
  .peq .i { width:20px; height:20px; }
  .peq[aria-pressed="true"] { background:var(--ink); color:#111; }
  .nomeados { display:grid; grid-template-columns:repeat(auto-fit,minmax(44px,1fr)); gap:6px; }
  .nomeados .peq { width:auto; height:56px; align-content:center; gap:3px; font-size:10px; font-weight:650; line-height:1; }
  .peq.perigo { color:var(--danger); }
  .peq.perigo.confirmar { background:var(--danger); color:#fff; }
  .cartao { background:var(--s1); border-radius:17px; padding:12px; }

  .bandas { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; }
  .banda { position:relative; height:74px; display:grid; justify-items:center; align-content:center; gap:4px; border-radius:15px; overflow:hidden; background:var(--s1); color:#d3d6db; font-size:10.5px; font-weight:650; }
  .banda em { position:absolute; inset:0; background:var(--tom); transform-origin:bottom; transform:scaleY(0); opacity:.34; will-change:transform; }
  .banda.golpe { box-shadow:inset 0 0 0 2px var(--tom); }
  .banda .i, .banda span { position:relative; }
  .banda[aria-pressed="true"] { color:#fff; box-shadow:inset 0 0 0 2px #fff; }
  .banda .i { width:24px; height:24px; }

  /* camadas */
  .camada { border-radius:15px; background:var(--s1); margin-bottom:8px; overflow:hidden; }
  .camada.ativa { box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.6); }
  .camada-topo { display:flex; align-items:center; gap:10px; width:100%; padding:7px; text-align:left; }
  .miniatura { width:44px; height:44px; flex:none; display:grid; place-items:center; border-radius:10px; background:#050506 center/cover no-repeat; color:#c8ccd2; box-shadow:inset 0 0 0 1px var(--line); }
  .camada-nome { flex:1; min-width:0; font-size:14px; font-weight:650; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .camada-nome small { display:block; font-size:11px; font-weight:550; color:var(--muted); }
  .camada-corpo { display:grid; gap:10px; padding:2px 8px 10px; }
  .misturas { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px; }
  .mistura { display:grid; justify-items:center; gap:3px; padding:7px 1px 6px; border-radius:12px; background:var(--s2); color:#d3d6db; font-size:10px; font-weight:650; }
  .mistura[aria-pressed="true"] { background:var(--ink); color:#111; }
  .mistura .i { width:32px; height:32px; }
  .mais-camada { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; height:48px; border-radius:15px; border:1.5px dashed rgba(255,255,255,.2); color:#d3d6db; font-size:13px; font-weight:650; margin-bottom:8px; }

  /* salvar */
  .nome-campo { display:flex; align-items:center; gap:8px; padding:6px 6px 6px 14px; border-radius:17px; background:var(--s2); }
  .nome-campo input { flex:1; min-width:0; background:none; border:0; outline:0; color:var(--ink); font:inherit; font-size:16px; height:44px; }
  .nome-campo input::placeholder { color:var(--dim); }
  .salvar { display:flex; align-items:center; gap:7px; height:44px; padding:0 15px 0 11px; border-radius:13px; background:var(--ink); color:#111; font-size:13px; font-weight:750; white-space:nowrap; }
  .salvar.seg { background:var(--s3); color:var(--ink); }
  .salvar .i { width:18px; height:18px; }
  .minha-acoes { display:flex; gap:4px; position:absolute; top:5px; left:5px; right:5px; justify-content:space-between; }
  .minha-acoes button { width:34px; height:34px; display:grid; place-items:center; border-radius:50%; }
  .minha-acoes .i { width:17px; height:17px; }

  /* abas */
  .abas { flex:none; display:grid; grid-auto-flow:column; grid-auto-columns:1fr; padding:5px 6px calc(5px + env(safe-area-inset-bottom)); background:rgba(11,12,14,.96); border-top:1px solid var(--line); }
  .aba { position:relative; display:grid; justify-items:center; gap:2px; padding:7px 2px 5px; color:var(--dim); font-size:10.5px; font-weight:650; transition:color .15s; }
  .aba .i { width:24px; height:24px; transition:transform .2s var(--ease); }
  .aba[aria-selected="true"] { color:#fff; }
  .aba[aria-selected="true"] .i { transform:translateY(-1px) scale(1.08); filter:drop-shadow(0 0 7px var(--luz)); }
  .aba em { position:absolute; top:3px; left:calc(50% + 7px); min-width:15px; height:15px; padding:0 4px; border-radius:8px; background:#fff; color:#111; font-size:10px; font-style:normal; font-weight:800; line-height:15px; text-align:center; }

  #toast { position:fixed; left:50%; bottom:calc(76px + env(safe-area-inset-bottom)); z-index:9; max-width:88vw; padding:10px 15px; transform:translate(-50%,10px); background:#f4f4f4; color:#000; border-radius:13px; font-size:13px; font-weight:700; opacity:0; pointer-events:none; transition:opacity .18s, transform .18s var(--ease); text-align:center; }
  #toast.on { opacity:1; transform:translate(-50%,0); }
  .sem-conexao { display:flex; align-items:center; justify-content:center; gap:6px; height:24px; background:var(--danger); color:#fff; font-size:12px; font-weight:700; flex:none; }

  /* Dentro do app no PC: o menu da esquerda já escolhe a luz. */
  .embutido #voltar { display:none; }
  .embutido .zonas { justify-content:flex-start; padding-left:8px; pointer-events:none; }
  .embutido .zona:not([aria-pressed="true"]) { display:none; }

  /* Tela larga: palco à esquerda, ferramentas à direita. O balcão é comprido: palco em cima, ferramentas embaixo. */
  @media (min-width:760px) {
    .sem-conexao { position:absolute; inset:0 0 auto 0; z-index:8; }
    body:not(.z-balcao) .app { display:grid; grid-template-columns:minmax(0,1fr) 460px; grid-template-rows:auto auto minmax(0,1fr) auto auto; column-gap:12px; }
    body:not(.z-balcao) .topo { grid-column:1 / -1; }
    body:not(.z-balcao) .palco { grid-column:1; grid-row:2 / span 3; height:auto; margin:0 0 12px 12px; }
    body:not(.z-balcao) .geral { grid-column:2; grid-row:2 / span 1; padding:0 12px 0 0; }
    body:not(.z-balcao) main { grid-column:2; grid-row:3; padding-left:0; }
    body:not(.z-balcao) .abas { grid-column:2; grid-row:4; }
    body:not(.z-balcao) .chips { margin-left:0; padding-left:0; }
    .z-balcao .palco { height:210px; }
    .z-balcao .grade { grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); }
    .z-balcao .ladrilhos, .z-balcao .ladrilhos.cinco { grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); }
    .z-balcao .pals { grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); }
    .z-balcao .bandas { max-width:520px; }
    #toast { bottom:84px; }
  }
  @media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<div class="app">
  <div class="sem-conexao" id="sem-conexao" hidden></div>
  <header class="topo">
    <a class="ico" id="voltar" aria-label="Voltar ao app"></a>
    <div class="zonas" id="zonas" role="group" aria-label="Qual luz"></div>
    <button class="ico" id="desfazer" aria-label="Desfazer"></button>
    <button class="ico" id="refazer" aria-label="Refazer"></button>
    <a class="ico" id="ajustes" aria-label="Ajustes avançados"></a>
  </header>

  <section class="palco" aria-label="Prévia das luzes">
    <canvas id="luz" aria-hidden="true"></canvas>
    <canvas id="tela"></canvas>
    <div class="palco-cima">
      <button class="modo vidro" id="modo"></button>
      <div class="esp"></div>
      <button class="bola vidro" id="flash" aria-label="Flash: segure para acender"></button>
      <button class="bola vidro" id="chave" aria-label="Ligar ou desligar esta luz"></button>
    </div>
    <div class="palco-baixo">
      <div class="nome-ar vidro" id="nome-ar"></div>
      <div class="esp"></div>
      <button class="envia" id="enviar" hidden></button>
      <div class="mini vidro" id="mini" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    </div>
  </section>
  <div class="geral" id="geral"></div>

  <main id="painel"></main>
  <nav class="abas" id="abas" role="tablist" aria-label="Ferramentas"></nav>
</div>
<div id="toast" role="status"></div>

<script src="estudio-icones.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const vibrar = () => { try { navigator.vibrate && navigator.vibrate(8); } catch {} };
const ler = k => { try { return localStorage.getItem(k); } catch { return null; } };
const guardar = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
const limita = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));

const ZONAS = [
  { id: 'fita:barras', inst: 'barras', andar: '5', nome: 'Barras', curto: '', icone: 'barras', alvo: 'barras', lista: 'barras', onde: 'nas barras' },
  { id: 'fita:sexto', inst: 'sexto', andar: '5', nome: 'Balcão 5º', curto: '5º', icone: 'balcao', alvo: 'balcao', lista: 'balcoes', onde: 'no balcão' },
  { id: 'fita:terreo', inst: 'terreo', andar: '1', nome: 'Balcão 1º', curto: '1º', icone: 'balcao', alvo: null, lista: 'balcoes', onde: 'no balcão' },
];
const GRUPOS_BARRAS = [

  $('tinta-zerar').onclick = () => { vibrar(); mandar({ type: 'filtro', andar: zona.andar, zona: zona.id, zerar: true }); };
  pintarTinta();
}

// Som
function linhaDeBandas(sel, aoEscolher, comMedidor) {
  const b = document.createElement('div');
  b.className = 'bandas';
  b.innerHTML = BANDAS.map(([ic, nome, tom], q) => `<button class="banda" ${comMedidor ? `data-q="${q}"` : ''} data-e="${q}" aria-pressed="${sel === q}" style="--tom:var(${tom})" aria-label="${nome}"><em></em>${icone(ic)}<span>${nome}</span></button>`).join('');
  b.querySelectorAll('.banda').forEach(x => { x.onclick = () => { vibrar(); aoEscolher(+x.dataset.e); }; });
  return b;
}
function painelSom(p) {
  const aberto = c.brilhos.find(b => b.tipo === brilhoAberto) || null;
  const sb = secao(p, 'som', aberto ? `Quem dispara ${catalogo.brilhos[aberto.tipo].nome}` : 'Som agora');
  sb.appendChild(linhaDeBandas(aberto ? aberto.fonte : -1, q => { if (!aberto) { avisar('Ligue um brilho abaixo'); return; } aberto.fonte = q; idAtual = null; mudou(); desenharPainel(); }, true));

  const se = secao(p, 'b-faisca', 'Brilhos por cima');
  const lad = document.createElement('div');
  lad.className = 'ladrilhos cinco';
  lad.innerHTML = Object.entries(catalogo.brilhos).map(([t, v]) => {
    const b = c.brilhos.find(x => x.tipo === t);
    return `<button class="lad${b ? ' ligado on' : ''}${brilhoAberto === t && b ? ' ativo' : ''}" data-tipo="${t}" aria-pressed="${!!b}" style="${b ? `--cor-brilho:${b.cor}` : ''}">${icone('b-' + t)}${esc(v.nome)}</button>`;
  }).join('');
  se.appendChild(lad);
  lad.querySelectorAll('.lad').forEach(b => {
    b.onclick = () => {
      vibrar();
      const t = b.dataset.tipo, atual = c.brilhos.find(x => x.tipo === t);
      if (!atual) {
        if (c.brilhos.length >= MAX_BRILHOS) { avisar(`Até ${MAX_BRILHOS} brilhos juntos`); return; }
        c.brilhos.push({ tipo: t, fonte: catalogo.brilhos[t].fonte, forca: 0.85, qtd: 0.5, cor: '#ffffff' });
        brilhoAberto = t;
      } else if (brilhoAberto === t) { c.brilhos = c.brilhos.filter(x => x !== atual); brilhoAberto = null; }
      else brilhoAberto = t;
      idAtual = null; mudou(); desenharPainel();
    };
  });
  if (aberto) {
    const pilha = document.createElement('div');
    pilha.className = 'pilha cartao';
    pilha.appendChild(regua({ icone: 'flash', nome: 'Força', valor: Math.round(aberto.forca * 100), compacta: true, aoMudar: v => { aberto.forca = v / 100; idAtual = null; mudou(); } }));
    pilha.appendChild(regua({ icone: 'b-glitter', nome: 'Quantidade', valor: Math.round(aberto.qtd * 100), compacta: true, aoMudar: v => { aberto.qtd = v / 100; idAtual = null; mudou(); } }));
    pilha.appendChild(seletorCor({ valor: aberto.cor, comRoda: false, aoMudar: h => {
      aberto.cor = h; idAtual = null; mudou();
      const l = lad.querySelector(`[data-tipo="${aberto.tipo}"]`); if (l) l.style.setProperty('--cor-brilho', h);
    } }));
    se.appendChild(pilha);
  }

  const sd = secao(p, 'duck', 'Duck: o golpe abaixa a luz');
  const d = c.duck, cart = document.createElement('div');
  cart.className = 'cartao';
  const todasAbaixam = c.camadas.length > 0 && c.camadas.every(k => k.duck);
  cart.innerHTML = `<div class="botoes nomeados">
    <button class="peq" id="d-liga" aria-pressed="${d.ligado}" aria-label="Ligar o duck">${icone('chave')}Duck</button>
    <button class="peq" id="d-fundo" aria-pressed="${c.fundo.duck !== false}" aria-label="O fundo abaixa">${icone('f-vertical')}Fundo</button>
    <button class="peq" id="d-camadas" aria-pressed="${todasAbaixam}" aria-label="As camadas abaixam">${icone('camadas')}Camadas</button>
    <button class="peq" id="d-inverte" aria-pressed="${!!d.inverso}" aria-label="Inverter: sobe no golpe">${icone('virar')}Inverte</button>
  </div>
  <div style="height:6px;margin-top:10px;border-radius:3px;background:var(--s3);overflow:hidden" ${d.ligado ? '' : 'hidden'}><div id="duck-gr" style="height:100%;width:100%;background:var(--warn)"></div></div>`;
  sd.appendChild(cart);
  const liga = (id, fn) => { cart.querySelector('#' + id).onclick = () => { vibrar(); fn(); idAtual = null; mudou(); desenharPainel(); }; };
  liga('d-liga', () => { d.ligado = !d.ligado; if (d.ligado && !c.camadas.some(k => k.duck) && c.fundo.tipo === 'preto') c.camadas.forEach(k => { k.duck = true; }); });
  liga('d-fundo', () => { c.fundo.duck = c.fundo.duck === false; });
  liga('d-camadas', () => { const v = !todasAbaixam; c.camadas.forEach(k => { k.duck = v; }); });
  liga('d-inverte', () => { d.inverso = !d.inverso; });
  if (d.ligado) {
    const pilha = document.createElement('div');
    pilha.className = 'pilha';
    pilha.appendChild(linhaDeBandas(d.fonte, q => { d.fonte = q; idAtual = null; mudou(); desenharPainel(); }, false));
    pilha.appendChild(regua({ icone: 'duck', nome: 'Quanto abaixa', valor: Math.round(d.quantidade * 100), compacta: true, aoMudar: v => { d.quantidade = v / 100; idAtual = null; mudou(); } }));
    pilha.appendChild(regua({ icone: 'desfazer', nome: 'Volta em', valor: Math.round((d.soltura - 0.03) / 1.47 * 100), compacta: true, texto: v => Math.round(30 + v * 14.7) + ' ms', aoMudar: v => { d.soltura = 0.03 + v / 100 * 1.47; idAtual = null; mudou(); } }));
    cart.appendChild(pilha);
  }
}

// Camadas
function painelCamadas(p) {
  const topo = document.createElement('button');
  topo.className = 'camada-topo camada';
  topo.innerHTML = `<div class="miniatura">${icone('b-faisca')}</div><div class="camada-nome">Brilhos<small>${c.brilhos.length ? c.brilhos.map(b => catalogo.brilhos[b.tipo].nome).join(', ') : 'Nenhum ainda'}</small></div>${icone('voltar', 'gira')}`;
  topo.lastChild.style.transform = 'rotate(180deg)';
  topo.onclick = () => { vibrar(); aba = 'som'; guardar('estudio-aba', aba); desenharAbas(); desenharPainel(); };
  p.appendChild(topo);

  const mais = document.createElement('button');
  mais.className = 'mais-camada';
  mais.disabled = c.camadas.length >= MAX_CAMADAS;
  mais.innerHTML = icone('mais') + 'Nova camada';
  mais.onclick = () => { vibrar(); adicionando = true; aba = 'cenas'; desenharAbas(); desenharPainel(); $('painel').scrollTop = 0; };
  p.appendChild(mais);

  for (let n = c.camadas.length - 1; n >= 0; n--) p.appendChild(linhaDaCamada(n));

  const base = document.createElement('button');
  base.className = 'camada-topo camada';
  base.innerHTML = `<div class="miniatura">${icone(FUNDOS_ICONE[c.fundo.tipo] || 'f-preto')}</div><div class="camada-nome">Fundo<small>${NOME_FUNDO[c.fundo.tipo] || ''}</small></div>${icone('voltar')}`;
  base.lastChild.style.transform = 'rotate(180deg)';
  base.onclick = () => { vibrar(); aba = 'cor'; guardar('estudio-aba', aba); desenharAbas(); desenharPainel(); };
  p.appendChild(base);
}
function linhaDaCamada(n) {
  const k = c.camadas[n], ehAtiva = n === ativa;
  const caixa = document.createElement('div');
  caixa.className = 'camada' + (ehAtiva ? ' ativa' : '');
  const a = listaAtual().find(x => x.id === k.cena);
  const foto = a && a.thumb ? `background-image:url('${esc(a.thumb)}')` : '';
  caixa.innerHTML = `<div class="camada-topo">
      <button class="miniatura" data-acao="abrir" aria-label="Editar ${esc(k.nome)}" style="${foto}">${foto ? '' : icone('cenas')}</button>
      <button class="camada-nome" data-acao="abrir" style="text-align:left">${esc(k.nome || k.efeito)}<small>${esc(catalogo.misturas[k.mistura || 'cima'] || '')} · ${Math.round(k.opacidade * 100)}%</small></button>
      <button class="peq" data-acao="olho" style="${k.oculta ? "color:var(--dim)" : ""}" aria-label="${k.oculta ? "Mostrar" : "Esconder"} esta camada" title="Mostrar ou esconder">${icone(k.oculta ? 'olhoFora' : 'olho')}</button>
    </div>`;
  const atualiza = () => { idAtual = null; mudou(); };
  caixa.querySelectorAll('[data-acao="abrir"]').forEach(b => { b.onclick = () => { vibrar(); ativa = ehAtiva ? -1 : n; if (ativa < 0) ativa = n; desenharPainel(); marcarCenas(); }; });
  caixa.querySelector('[data-acao="olho"]').onclick = () => { vibrar(); k.oculta = !k.oculta; atualiza(); desenharPainel(); };
  if (ehAtiva) {
    const corpo = document.createElement('div');
    corpo.className = 'camada-corpo';
    corpo.appendChild(regua({ icone: 'sol', nome: 'Opacidade', valor: Math.round(k.opacidade * 100), compacta: true, aoMudar: v => { k.opacidade = v / 100; atualiza(); const s = caixa.querySelector('small'); if (s) s.textContent = `${catalogo.misturas[k.mistura || 'cima'] || ''} · ${v}%`; } }));
    const mis = document.createElement('div');
    mis.className = 'misturas';
    mis.innerHTML = Object.entries(catalogo.misturas).map(([id, nome]) => `<button class="mistura" data-m="${id}" aria-pressed="${(k.mistura || 'cima') === id}">${iconeMistura(id)}${esc(nome.replace('Mais claro', 'Claro'))}</button>`).join('');
    corpo.appendChild(mis);
    mis.querySelectorAll('.mistura').forEach(b => { b.onclick = () => { vibrar(); k.mistura = b.dataset.m; atualiza(); desenharPainel(); }; });
    const bts = document.createElement('div');
    bts.className = 'botoes nomeados';
    const botao = (id, ic, nome, curto, pressionado) => `<button class="peq" data-b="${id}" ${pressionado != null ? `aria-pressed="${pressionado}"` : ''} aria-label="${nome}">${icone(ic)}${curto}</button>`;
    bts.innerHTML = botao('virar', 'virar', 'De cabeça para baixo', 'Virar', !!k.virar) + botao('espelhar', 'espelhar', 'Espelhar os lados', 'Espelho', !!k.espelhar) + botao('duck', 'duck', 'Abaixa no duck', 'Duck', !!k.duck) +
      botao('trocar', 'cenas', 'Trocar a cena', 'Trocar') + botao('sobe', 'cima', 'Pôr acima', 'Subir') + botao('desce', 'baixo', 'Pôr abaixo', 'Descer') + `<button class="peq perigo" data-b="tira" aria-label="Tirar a camada">${icone('lixo')}Tirar</button>`;
    corpo.appendChild(bts);
    const tira = bts.querySelector('[data-b="tira"]');
    bts.querySelector('[data-b="sobe"]').disabled = n === c.camadas.length - 1;
    bts.querySelector('[data-b="desce"]').disabled = n === 0;
    bts.querySelectorAll('.peq').forEach(b => {
      b.onclick = () => {
        vibrar();
        const l = c.camadas;
        switch (b.dataset.b) {
          case 'virar': k.virar = !k.virar; break;
          case 'espelhar': k.espelhar = !k.espelhar; break;
          case 'duck': k.duck = !k.duck; break;
          case 'trocar': aba = 'cenas'; desenharAbas(); desenharPainel(); return;
          case 'sobe': [l[n], l[n + 1]] = [l[n + 1], l[n]]; ativa = n + 1; break;
          case 'desce': [l[n], l[n - 1]] = [l[n - 1], l[n]]; ativa = n - 1; break;
          case 'tira': l.splice(n, 1); ativa = Math.max(0, l.length - 1); tira.blur(); break;
        }
        atualiza(); desenharPainel();
      };
    });
    caixa.appendChild(corpo);
  }
  return caixa;
}

// Salvar
const confirmando = {};
function painelSalvar(p) {
  const s = secao(p, 'estrela', idAtual ? 'Esta criação' : 'Nova criação');
  const campo = document.createElement('div');
  campo.className = 'nome-campo';
  campo.innerHTML = `<input id="nome" maxlength="40" placeholder="Nome" autocomplete="off" value="${esc(nomeAtual)}" aria-label="Nome da criação">` +
    (idAtual ? `<button class="salvar seg" id="atualizar">${icone('ok')}Atualizar</button>` : '') +
    `<button class="salvar" id="salvar">${icone('estrela')}Salvar</button>`;
  s.appendChild(campo);
  campo.querySelector('#nome').oninput = e => { nomeAtual = e.target.value; };
  campo.querySelector('#salvar').onclick = () => salvar(false);
  const at = campo.querySelector('#atualizar');
  if (at) at.onclick = () => salvar(true);

  const novo = document.createElement('div');
  novo.className = 'botoes'; novo.style.marginTop = '10px';
  novo.innerHTML = `<button class="salvar seg" id="do-zero">${icone('mais')}Começar do zero</button>`;
  s.appendChild(novo);
  novo.firstChild.onclick = () => {
    vibrar(); c = novaComposicao(); ativa = 0; idAtual = null; nomeAtual = ''; brilhoAberto = null;
    mudou(); aba = 'cenas'; guardar('estudio-aba', aba); desenharAbas(); desenharPainel();
  };

  const minhas = listaAtual().filter(a => a.criada);
  const sm = secao(p, 'minhas', 'Minhas');
  if (!minhas.length) { sm.insertAdjacentHTML('beforeend', `<div class="vazio">${icone('estrela')}<span>Suas criações aparecem aqui</span></div>`); return; }
  const grade = document.createElement('div');
  grade.className = 'grade';
  for (const a of minhas) {
    const b = document.createElement('div');
    b.className = 'cena' + (a.id === idAtual ? ' on' : '');
    b.style.cursor = 'pointer';
    b.setAttribute('role', 'button'); b.tabIndex = 0;
    if (a.thumb) b.style.backgroundImage = `url('${esc(a.thumb)}')`;
    b.innerHTML = `${a.preview ? `<video muted loop autoplay playsinline src="${esc(a.preview)}"></video>` : ''}<span>${esc(a.nome)}</span><div class="minha-acoes"><button class="vidro" data-a="ar" aria-label="Pôr ${esc(a.nome)} nas barras" title="Pôr nas barras">${icone('enviar')}</button><button class="vidro" data-a="lixo" aria-label="Apagar ${esc(a.nome)}" title="Apagar" style="${confirmando[a.id] ? 'background:var(--danger);color:#fff' : ''}">${icone('lixo')}</button></div>`;
    b.onclick = e => {
      const ac = e.target.closest('[data-a]');
      vibrar();
      if (!ac) { abrirCena(a); idAtual = a.id; nomeAtual = a.nome; ultimaEdicao = Date.now(); if (!aoVivo) enviarAgora(); gravarHistoria(); desenharAbas(); desenharPainel(); desenharNome(); return; }
      if (ac.dataset.a === 'ar') { mandar({ type: 'cena', andar: zona.andar, zona: zona.id, id: a.id }); noArVisto = a.id; avisar(`${a.nome} ${zona.onde}`); return; }
      if (!confirmando[a.id]) { confirmando[a.id] = true; avisar('Toque de novo para apagar'); desenharPainel(); setTimeout(() => { delete confirmando[a.id]; if (aba === 'salvar') desenharPainel(); }, 3000); return; }
      delete confirmando[a.id];
      fetch('/api/criacoes/' + encodeURIComponent(a.id), { method: 'DELETE' }).then(() => { if (idAtual === a.id) idAtual = null; avisar('Apagada'); lerListas(); }).catch(() => avisar('Sem conexão'));
    };
    grade.appendChild(b);
  }
  sm.appendChild(grade);
}
async function salvar(mesmo) {
  const nome = ($('nome') ? $('nome').value : nomeAtual).trim();
  if (!nome) { if ($('nome')) $('nome').focus(); avisar('Dê um nome'); return; }
  vibrar();
  try {
    const r = await fetch('/api/criacoes', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id: mesmo ? idAtual : undefined, nome, balcao: montar(), lista: zona.lista }) });
    const d = await r.json();
    if (!r.ok) { avisar(d.erro || 'Não salvou'); return; }
    idAtual = d.id; nomeAtual = d.nome;
    avisar(`${d.nome} salva em Minhas`);
    await lerListas();
  } catch { avisar('Sem conexão'); }
}

// ---------- botões fixos ----------
$('voltar').innerHTML = icone('voltar');
$('desfazer').innerHTML = icone('desfazer');
$('refazer').innerHTML = icone('refazer');
$('ajustes').innerHTML = icone('ajustes');
$('flash').innerHTML = icone('flash');
$('chave').innerHTML = icone('chave');
$('desfazer').onclick = () => irNaHistoria(-1);
$('refazer').onclick = () => irNaHistoria(1);
$('modo').onclick = () => {
  vibrar();
  aoVivo = !aoVivo;
  guardar('estudio-modo', aoVivo ? 'vivo' : 'ensaio');
  desenharModo();
  avisar(aoVivo ? `Ao vivo: o que você mexer entra ${zona.onde}` : 'Ensaio: a luz fica como está');
  assinarPrevia();
  if (aba === 'cor') desenharPainel();
};
$('enviar').onclick = () => {
  vibrar();
  const simples = cenaSimples();
  if (simples) mandar({ type: 'cena', andar: zona.andar, zona: zona.id, id: simples });
  else if (idAtual) mandar({ type: 'cena', andar: zona.andar, zona: zona.id, id: idAtual });
  else mandar({ type: 'rascunho-nas-barras', cena: montar(), zona: zona.id });
  avisar('No ar');
};
let chaveT = 0, armada = false;
$('chave').onclick = () => {
  vibrar();
  const f = fitaAtual();
  if (!f) return;
  if (!f.saida && !armada) { // ligar pede um 2º toque, como no resto do app
    armada = true; $('chave').classList.add('confirmar'); avisar('Toque de novo para ligar');
    chaveT = setTimeout(() => { armada = false; $('chave').classList.remove('confirmar'); }, 3000);
    return;
  }
  armada = false; clearTimeout(chaveT); $('chave').classList.remove('confirmar');
  mandar({ type: 'balcao-saida', id: f.id, ligada: !f.saida });
};
// Flash: toque pisca, segurar mantém. Mesmo caminho dos botões do LED.
(() => {
  const b = $('flash');
  let repete = 0;
  const pede = acao => fetch(`/api/show?acao=${acao}&alvos=${zona.alvo}&strobo=0`, { method: 'POST' }).catch(() => {});
  b.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (repete || !zona.alvo) return;
    try { b.setPointerCapture(e.pointerId); } catch {}
    vibrar(); b.classList.add('on');
    pede('liga');
    repete = setInterval(() => pede('liga'), 400);
  });
  const solta = () => { if (!repete) return; clearInterval(repete); repete = 0; b.classList.remove('on'); pede('solta'); };
  b.addEventListener('pointerup', solta);
  b.addEventListener('pointercancel', solta);
})();

// ---------- início ----------
(async () => {
  try { catalogo = await (await fetch('/api/criacoes/catalogo')).json(); } catch { avisar('Sem conexão com o servidor'); }
  await lerListas();
  montarPedacosDaZona();
  gravarHistoria();
  ligarSom();
  conectar();
})();
</script>
