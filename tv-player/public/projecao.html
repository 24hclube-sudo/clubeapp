<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0c0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Projeção</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg:#0b0c0e; --s1:#15171b; --s2:#1d2025; --s3:#262a31; --line:rgba(255,255,255,.08);
    --ink:#f3f4f6; --muted:#979da6; --dim:#5d636c; --ok:#34d17a; --warn:#ffc465; --danger:#ff5a3c;
    --ease:cubic-bezier(.2,.8,.2,1); --r:20px;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--ink); min-height:100%;
    font-family:-apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased; touch-action:manipulation; }
  button,a { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; text-decoration:none; }
  :focus-visible { outline:2px solid #fff; outline-offset:2px; }
  [hidden] { display:none !important; }
  svg { display:block; }

  .app { max-width:760px; margin:0 auto; padding:calc(env(safe-area-inset-top) + 6px) 14px calc(env(safe-area-inset-bottom) + 28px); }
  .topo { display:flex; align-items:center; gap:6px; height:52px; }
  .voltar { width:44px; height:44px; border-radius:50%; display:grid; place-items:center; flex:none; }
  .voltar:active { background:var(--s3); }
  .voltar svg { width:24px; height:24px; }
  .topo h1 { flex:1; margin:0; font-size:20px; font-weight:750; letter-spacing:-.01em; }
  .ponto { width:10px; height:10px; border-radius:50%; background:var(--dim); margin-right:8px; flex:none; transition:background .3s; }
  .ponto.ok { background:var(--ok); box-shadow:0 0 10px rgba(52,209,122,.6); }
  .ponto.erro { background:var(--danger); }

  /* o que está nas paredes agora */
  .ar { background:var(--s1); border-radius:var(--r); padding:16px; display:grid; grid-template-columns:76px 1fr; gap:14px; align-items:center; margin-top:4px; }
  .ar-ico { width:76px; height:76px; border-radius:22px; display:grid; place-items:center; color:#fff; transition:background .4s; box-shadow:0 10px 30px rgba(0,0,0,.35); }
  .ar-ico svg { width:40px; height:40px; animation:respira 3.2s var(--ease) infinite; }
  @keyframes respira { 50% { transform:scale(1.08); } }
  .ar small { display:block; color:var(--muted); font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.09em; }
  .ar b { display:block; font-size:22px; font-weight:750; margin:3px 0 2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ar span { display:block; color:var(--muted); font-size:14px; }

  .linhas { background:var(--s1); border-radius:var(--r); margin-top:12px; padding:4px 16px; }
  .linha { display:grid; grid-template-columns:36px 1fr auto; gap:12px; align-items:center; min-height:64px; }
  .linha + .linha { border-top:1px solid var(--line); }
  .linha .li { width:36px; height:36px; border-radius:11px; background:var(--s3); display:grid; place-items:center; color:var(--ink); }
  .linha .li svg { width:21px; height:21px; }
  .linha b { display:block; font-size:16px; }
  .linha small { display:block; color:var(--muted); font-size:13px; margin-top:2px; }
  .chave { width:52px; height:32px; border-radius:16px; background:rgba(255,255,255,.16); position:relative; transition:background .25s; flex:none; }
  .chave::after { content:""; position:absolute; top:3px; left:3px; width:26px; height:26px; border-radius:50%; background:#fff; transition:transform .25s var(--ease); }
  .chave.on { background:var(--ok); }
  .chave.on::after { transform:translateX(20px); }

  h2 { font-size:13px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.09em; margin:26px 4px 10px; }
  .grade { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  @media (min-width:560px) { .grade { grid-template-columns:repeat(4,1fr); } }
  .cena { position:relative; background:var(--s1); border-radius:18px; padding:14px 8px 12px; display:flex; flex-direction:column; align-items:center; gap:9px; min-height:116px;
    transition:transform .15s var(--ease), background .2s; overflow:hidden; isolation:isolate; }
  .cena:active { transform:scale(.95); }
  .cena::before { content:""; position:absolute; inset:0; background:var(--tinta); opacity:0; z-index:-1; transition:opacity .3s; }
  .cena .ico { width:52px; height:52px; border-radius:16px; display:grid; place-items:center; background:var(--s3); color:var(--ink); transition:background .3s; }
  .cena .ico svg { width:28px; height:28px; }
  .cena b { font-size:13.5px; font-weight:650; text-align:center; line-height:1.2; }
  /* bolinha de "no ar": não briga com o ícone */
  .cena em { position:absolute; top:9px; right:9px; width:9px; height:9px; border-radius:50%; background:#fff; font-size:0; box-shadow:0 0 10px #fff;
    opacity:0; transform:scale(.4); transition:.25s var(--ease); }
  .cena.on { box-shadow:0 0 0 2px #fff; }
  .cena.on::before { opacity:.9; }
  .cena.on .ico { background:rgba(255,255,255,.18); color:#fff; }
  .cena.on b { color:#fff; }
  .cena.on em { opacity:1; transform:none; }
  .nota { color:var(--dim); font-size:12.5px; margin:26px 4px 0; line-height:1.45; }
</style>
</head>
<body>
<div class="app" id="raiz">
  <div class="topo">
    <a class="voltar" id="voltar" href="celular.html#/andar/5" aria-label="Voltar ao 5º andar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></a>
    <h1>Projeção</h1>
    <span class="ponto" id="pj-ponto"></span>
  </div>

  <div class="ar">
    <div class="ar-ico" id="pj-ar-ico"></div>
    <div style="min-width:0"><small>Nas paredes</small><b id="pj-ar-nome">—</b><span id="pj-ar-sub">Conectando…</span></div>
  </div>

  <div class="linhas">
    <div class="linha"><span class="li" id="pj-ico-auto"></span><div><b>Automática</b><small>As cenas vão trocando sozinhas</small></div><button class="chave" id="pj-auto" aria-label="Automática"></button></div>
    <div class="linha" id="pj-logo-linha" hidden><span class="li" id="pj-ico-logo"></span><div><b>Logo CLUBE</b><small>Por cima de qualquer cena</small></div><button class="chave" id="pj-logo" aria-label="Logo por cima"></button></div>
  </div>

  <div id="pj-lista"></div>
  <p class="nota">As cenas vêm do servidor das paredes: cena nova criada lá aparece aqui sozinha.</p>
</div>
<script src="projecao-app.js"></script>
<script>
  // dentro do app no PC a coluna da esquerda já faz o papel de voltar
  if (new URLSearchParams(location.search).get('embed') === '1') document.getElementById('voltar').hidden = true;
  document.getElementById('pj-ico-auto').innerHTML = Projecao.icone('auto');
  document.getElementById('pj-ico-logo').innerHTML = Projecao.icone('logo');
  Projecao.montarTela(document.getElementById('raiz'));
</script>
</body>
</html>
