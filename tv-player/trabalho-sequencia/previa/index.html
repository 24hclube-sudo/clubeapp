<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Novas artes das TVs</title>
<style>
  :root { --bg: #0b0c0e; --ink: #f2f2f2; --muted: #9aa0a6; --card: #15171b; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, sans-serif; padding: 20px 16px 40px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 20px; }
  .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
  figure { margin: 0; background: var(--card); border-radius: 14px; overflow: hidden; }
  video { display: block; width: 100%; aspect-ratio: 9 / 16; background: #000; }
  figcaption { padding: 10px 12px 12px; }
  figcaption b { display: block; }
  figcaption span { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<h1>Novas artes das TVs: Pista Quente &amp; Millos Kaiser</h1>
<p class="sub">5 animações de 16 s em loop, 9:16 em tela cheia, feitas com a arte do Akin. Ainda não estão no app nem nas TVs.</p>
<div class="grade">
  <figure><video src="vivo.mp4" autoplay muted loop playsinline></video><figcaption><b>Akin animado</b><span>O cartaz do Akin vivo: degradê correndo, título e cabeça batendo a 120 BPM, selos girando; a cada 4 s as cores invertem por meia batida.</span></figcaption></figure>
  <figure><video src="cabecas.mp4" autoplay muted loop playsinline></video><figcaption><b>Cabeças</b><span>Grade de cabeças em xadrez de cores subindo, em onda, com a faixa azul do título no meio.</span></figcaption></figure>
  <figure><video src="letreiro.mp4" autoplay muted loop playsinline></video><figcaption><b>Letreiro</b><span>PISTA QUENTE &amp; / MILLOS KAISER correndo em sentidos opostos atrás da cabeça.</span></figcaption></figure>
  <figure><video src="palavras.mp4" autoplay muted loop playsinline></video><figcaption><b>Palavras</b><span>Uma palavra por segundo enchendo a tela, cores alternando, e fecha com o cartaz.</span></figcaption></figure>
  <figure><video src="calor.mp4" autoplay muted loop playsinline></video><figcaption><b>Calor</b><span>O cartaz tremendo como ar quente, com mais força a cada 2 batidas.</span></figcaption></figure>
</div>
</body>
</html>
